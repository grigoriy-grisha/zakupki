name: Build and Push

on:
    push:
        branches: [main, authorization-admin]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag (defaults to branch-sha)'
                required: false
                type: string

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: grigoriy-grisha/zakupki-frontend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve image tag
              id: tag
              run: |
                  if [ -n "${{ inputs.tag }}" ]; then
                    echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/frontend/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
                  build-args: |
                      NEXT_PUBLIC_VK_APP_ID=${{ secrets.NEXT_PUBLIC_VK_APP_ID }}
                      NEXT_PUBLIC_VK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_VK_REDIRECT_URL }}
                      NEXT_PUBLIC_TELEGRAM_BOT_ID=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_ID }}
                      NEXT_PUBLIC_BOT_USERNAME=${{ secrets.NEXT_PUBLIC_BOT_USERNAME }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Summary
              run: |
                  echo "### Image pushed 🚀" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
